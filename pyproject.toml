[project]
name = "daily_ai_news_automation"
version = "0.1.0"
description = "daily_ai_news_automation using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]==1.14.4",
]

[project.scripts]
daily_ai_news_automation = "daily_ai_news_automation.main:run"
run_crew = "daily_ai_news_automation.main:run"
train = "daily_ai_news_automation.main:train"
replay = "daily_ai_news_automation.main:replay"
test = "daily_ai_news_automation.main:test"
run_with_trigger = "daily_ai_news_automation.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
